name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 es MIN_NODE_MAJOR en lib/config.js — el CLI lo declara como piso,
        # así que el piso se prueba de verdad, no solo la versión del momento.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install CLI dependencies
        run: npm ci

      # Las dos suites corren por separado a propósito: si algo se pone rojo,
      # el nombre del step ya dice si falló el generador (Contexto A) o el
      # payload que reciben los proyectos generados (Contexto B).
      - name: CLI tests (bin/ + lib/)
        run: npm run test:cli

      # Los hooks de templates/ no tienen dependencias — corren sin install.
      # Esta es la suite que documenta templates-contract.md como obligatoria:
      # compact-recovery.js estuvo roto varias versiones porque nadie la corría.
      - name: Hook contract tests (templates/)
        run: npm run test:hooks
