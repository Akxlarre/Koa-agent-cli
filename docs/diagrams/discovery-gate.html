<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Discovery Gate</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-family: var(--font-sans);
      font-size: 0.9rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 640px;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Harness agéntico</p>
    <h1>El Discovery Gate</h1>
    <p class="sub">El mecanismo central de <code>templates/.claude/</code>: bloquea una escritura si el agente no leyó primero el índice correspondiente. No es el CLI — es lo que corre dentro de cada proyecto generado.</p>

    <svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="discovery-gate-title discovery-gate-desc">
      <title id="discovery-gate-title">El Discovery Gate del harness agéntico</title>
      <desc id="discovery-gate-desc">Flujo de un turno de Claude Code: leer un índice marca un flag de sesión, pre-write-guard.js lo exige antes de permitir una escritura, y compact-recovery.js reinyecta ese mismo flag tras una compactación de contexto para que el gate no vuelva a bloquear accesos ya ganados.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows first (behind boxes) -->
      <line x1="460" y1="96" x2="460" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="460" y1="168" x2="460" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="460" y1="240" x2="460" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- diamond NO -> bloqueado -->
      <line x1="560" y1="304" x2="680" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- diamond YES -> write-tracker -->
      <line x1="460" y1="352" x2="460" y2="372" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="460" y1="428" x2="460" y2="444" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="460" y1="500" x2="460" y2="516" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- discovery-flag: step2 -> compact-recovery (dashed, optional/async) -->
      <line x1="540" y1="140" x2="700" y2="140" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="592" y="284" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="604" y="293" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">NO</text>

      <rect x="472" y="356" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="488" y="365" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">YES</text>

      <rect x="588" y="122" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="620" y="131" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DISCOVERY-FLAG</text>

      <!-- Node 1: Start oval -->
      <rect x="380" y="40" width="160" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="460" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Nueva sesión</text>
      <text x="460" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SessionStart</text>

      <!-- Node 2: Lee índice -->
      <rect x="380" y="112" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="460" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lee un índice</text>
      <text x="460" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">discovery-tracker.js</text>

      <!-- Node 3: Intenta escribir -->
      <rect x="380" y="184" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="460" y="208" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Edita / escribe</text>
      <text x="460" y="224" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Edit · Write · MultiEdit</text>

      <!-- Node 4: Diamond gate (focal) -->
      <polygon points="460,256 560,304 460,352 360,304" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="460" y="300" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">pre-write-guard.js</text>
      <text x="460" y="314" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">¿índice leído?</text>

      <!-- Node 5: Bloqueado -->
      <rect x="680" y="276" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="780" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bloqueado</text>
      <text x="780" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">breaker.json · 3 intentos y escala</text>

      <!-- Node 6: write-tracker -->
      <rect x="380" y="372" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="460" y="396" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Registra la ruta</text>
      <text x="460" y="412" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">write-tracker.js</text>

      <!-- Node 7: Stop -->
      <rect x="380" y="444" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="460" y="468" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fin del turno</text>
      <text x="460" y="484" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">evento Stop</text>

      <!-- Node 8: End oval -->
      <rect x="380" y="516" width="160" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="460" y="540" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Verifica consistencia</text>
      <text x="460" y="556" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sync-check.js</text>

      <!-- Node 9: compact-recovery (optional / async) -->
      <rect x="700" y="112" width="220" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="810" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tras compactar contexto</text>
      <text x="810" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">compact-recovery.js · PostCompact</text>

      <!-- Legend -->
      <line x1="32" y1="616" x2="968" y2="616" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="640" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="112" y="628" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="132" y="638" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">EL GATE (foco)</text>

      <rect x="272" y="628" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="292" y="638" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PASO</text>

      <rect x="376" y="628" width="12" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="396" y="638" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">INICIO / FIN</text>

      <line x1="536" y1="634" x2="560" y2="634" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="568" y="638" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ASÍNCRONO</text>
    </svg>
  </div>
</body>
</html>
