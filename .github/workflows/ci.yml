name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 es MIN_NODE_MAJOR en lib/config.js — el CLI lo declara como piso,
        # así que el piso se prueba de verdad, no solo la versión del momento.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Son CUATRO suites, no dos (HUE-033) ─────────────────────────────
      #
      # Este workflow nació corriendo las dos primeras, con un comentario que
      # decía «las dos suites corren por separado a propósito». Son cuatro, y
      # las dos que faltaban son justamente las que estuvieron en rojo tres
      # tandas seguidas sin que nadie se enterara: el trinquete de presupuesto
      # de reglas vive en `test:guardrails`, y `test:provocacion` es lo único
      # que comprueba que las 28 reglas del linter puedan fallar.
      #
      # Un CI que corre la mitad de la verificación es el mismo patrón que este
      # repositorio persigue: verde sin haber mirado todo lo que dice mirar.
      #
      # Corren por separado a propósito: si algo se pone rojo, el nombre del
      # step ya dice qué se rompió sin abrir el log.

      - name: 1 · CLI tests (bin/ + lib/)
        run: npm run test:cli

      # Los hooks de templates/ no tienen dependencias — corren sin install.
      # Esta es la suite que documenta templates-contract.md como obligatoria:
      # compact-recovery.js estuvo roto varias versiones porque nadie la corría.
      - name: 2 · Hook contract tests (templates/.claude/)
        run: npm run test:hooks

      # Las dos de abajo prueban el payload, que parsea con la API de
      # TypeScript. `architect.js` resuelve `require('typescript')` desde SU
      # ubicación y no desde el cwd, así que alcanza con el node_modules del
      # repo — por eso `typescript` es devDependency aunque el CLI no compile.
      - name: 3 · Guardrail tests (linter del proyecto generado)
        run: npm run test:guardrails

      # La pregunta que ningún CI hace: no si las reglas pasan, sino si pueden
      # fallar. Arma un sandbox por regla con el archivo mínimo que la viola.
      - name: 4 · Provocación — ¿cada regla dispara ante su violación?
        run: npm run test:provocacion
